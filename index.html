<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Blog Theme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">My Blog</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-8">
        <h2>Latest Posts</h2>
        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title">Post Title One</h5>
            <p class="card-text">This is a short summary of the blog post.</p>
          </div>
        </div>
        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title">Post Title Two</h5>
            <p class="card-text">Another summary of a blog post.</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <h2>Sidebar</h2>
        <ul class="list-group">
          <li class="list-group-item">About Me</li>
          <li class="list-group-item">Categories</li>
          <li class="list-group-item">Archives</li>
        </ul>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-4">
    © 2025 My Blog Theme
  </footer>

</body>
</html>
